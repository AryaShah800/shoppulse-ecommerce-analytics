name: dbt
on: [push, pull_request]
jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install dbt-duckdb
      - run: dbt build
        working-directory: dbt
        env: {DBT_PROFILES_DIR: ., DO_NOT_TRACK: "1"}
