version: 2
seeds:
  - name: raw_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: raw_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_reviews
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
  - name: fct_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: purchased_at
        data_tests: [not_null]
  - name: mart_fulfilment_funnel
    columns:
      - name: orders
        data_tests: [not_null]
